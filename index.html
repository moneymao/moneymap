<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#2563eb" />
    <meta name="description" content="MoneyMap - Smart Personal Finance & Budget Tracker" />

    <!-- PWA Web App Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Mobile & iOS PWA Support -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="MoneyMap" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />

    <title>MoneyMap - Smart Personal Finance & Budget Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Suppress Netlify Injected Badge & Collaborative Feedback Drawer -->
    <script>
      (function () {
        const removeNetlifyElements = () => {
          const targets = document.querySelectorAll(
            '#netlify-badge, .netlify-badge, .netlify-badge-container, .netlify-drawer-root, netlify-drawer, [data-netlify-badge], [data-netlify-deploy-id], iframe[data-netlify-deploy-id], div[class*="netlify-drawer"], div[class*="NetlifyBadge"], div[class*="netlify-badge"]'
          );
          targets.forEach((el) => {
            try {
              el.remove();
            } catch (_) {}
          });
        };
        if (typeof window !== 'undefined') {
          window.addEventListener('DOMContentLoaded', removeNetlifyElements);
          window.addEventListener('load', removeNetlifyElements);
          if (window.MutationObserver) {
            const observer = new MutationObserver(() => removeNetlifyElements());
            observer.observe(document.documentElement, { childList: true, subtree: true });
          }
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
